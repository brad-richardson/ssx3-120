# ssx3-lobby example config. Copy to lobby.toml and set advertise_ip.
[lobby]
bind = "0.0.0.0"
# The IP clients dial AND the IP named in +ses/news (never 0.0.0.0).
# Example address from the TEST-NET-1 documentation range.
advertise_ip = "192.0.2.1"
motd = "WIP Server"

[ports]
lobby = 11000
game = 10901
buddy = 13505

# Room directory pushed after auth (name + peak id each).
[[rooms]]
name = "Beginner"
peak = 1
[[rooms]]
name = "Advanced"
peak = 2
[[rooms]]
name = "Elite"
peak = 3
[[rooms]]
name = "Intermediate"
peak = 4

[limits]
max_connections = 512
max_per_ip = 16
msg_per_sec_per_ip = 60
max_sessions = 256
max_queue = 128
# Admission (lane A): active-pair ceiling, per-IP pair ceiling (NAT
# households share one IP), per-IP queue ceiling (storm fairness).
# max_pairs is N-1 (99 relay ports; 3757 is Quick Play); refused
# waiters stay queued and retry, and the quik echo carries FULL=1 for the
# client message.
max_pairs = 98
max_pairs_per_ip = 4
max_queue_per_ip = 8
# Sessions (reserved names) per IP (M2): a few dozen IPs cannot hold
# all 256 names; unauthenticated game conns close after 10 s.
max_sessions_per_ip = 6
waiter_timeout_secs = 600
idle_probe_secs = 90
idle_close_secs = 240
# Buddy presence TCP idle lifetime (lobby-buddy-1: was hardcoded 300 s).
# Paired cover keeps racing pairs past both reaps; paired_grace_secs
# covers the results screen after the relay task ends.
buddy_close_secs = 300
paired_grace_secs = 300

[auth]
# Anonymous names; PASS is accepted only as a stock protocol field.
# Client must send a random per-install DID; requested names receive
# numeric suffixes on collision.
mode = "open"

[relay]
# "always" (default, Brad 10-13): +ses names the server relay; UDP is
# forwarded per pair. Robust for two clients behind the same public IP
# (pair-lock is on the full endpoint, not the IP) and for client
# isolation (clients only ever make outbound connections).
# "off" (opt-in): +ses names the peer (direct P2P, as today).
# "fallback": direct +ses plus a health event per pair (stub:
# NAT-failure detection needs a client-visible signal that does not
# exist on the wire).
mode = "always"
# The first pair takes port 3658; later pairs take 3659+. The HLE
# reads the assigned RLYPORT from each +ses, so concurrent pairs route
# to their own relay socket.
port_start = 3658
port_end = 3756
idle_timeout_secs = 120
# Per-pair packet token buckets (rate/s sustained + burst). A stock-60
# race needs ~40 pps per pair; these allow headroom plus the opening
# handshake burst. Drops never refresh idle.
packets_per_sec = 300
burst_packets = 600
per_role_per_sec = 150
per_role_burst = 300
# Handshake bucket (H1): hello/proof attempts pay here (one enrollment
# costs 2); garbage matching neither shape drops for free.
handshake_per_sec = 5
handshake_burst = 10
# Bandwidth ceiling with egress accounting (lane A). Cost per forwarded
# datagram is payload + 28 B IP/UDP overhead. A racing pair averages
# ~1.5 KB/s (~4.7 MB per pair-hour measured), so the per-pair bucket is
# ~5x and the global sustained rate is an abuse backstop far under the
# Always Free 10 TB/mo outbound allowance (list price applies only
# above that). A full house of 99 racing pairs 24/7 costs ~335 GB/mo.
# monthly_egress_cap_bytes gates new admissions past the cap (0 = off,
# default 8 TiB headroom under the free 10 TB); the counter resets on
# unit restart (monthly cadence: alerts lane).
bytes_per_sec_per_pair = 8192
burst_bytes_per_pair = 32768
# Global at/above a full house at per-pair maxima (M1: 99 x 8192):
# abuse stays bounded per pair, monthly cap is the real backstop.
global_bytes_per_sec = 812000
global_burst_bytes = 1048576
monthly_egress_cap_bytes = 8796093022208

[session]
# Prepared-but-optional +ses session token (our HLE ignores unknown
# +ses keys, so stock-60 compat holds either way).
token = false
# Each pairing races a random course from quick_tracks (SSX 3 event ids,
# default every race course: 0,1,2,3,4,14,15,16); quick_tracks = [] uses
# the fixed quick_track instead.
quick_track = 2
# quick_tracks = [0, 1, 2, 3, 4, 14, 15, 16]
quick_mode = 0
# Fixed server SKEY hex; empty = minted once at startup.
server_key = ""

[state_sync]
# Quick Play netplay (online-v0-1): 120<->120 matchmaking, START barrier,
# STATE relay and canonical results on one UDP port, the top of the relay
# UDP range the security list already opens (the O5 relay ends at 3756).
enable = true
bind = "0.0.0.0"
port = 3757
