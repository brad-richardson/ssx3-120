# ssx3-lobby production config (Oracle lobby host, DEP1).
# Source of truth; deployed by infra/deploy-lobby-rust.sh.
# Same TCP ports as MComm, relay=always, session token on.
[lobby]
bind = "0.0.0.0"
# The IP clients dial AND the IP named in +ses/news (never 0.0.0.0).
advertise_ip = "163.192.214.113"
motd = "WIP Server"

[ports]
lobby = 11000
game = 10901
buddy = 13505

# Room directory pushed after auth (name + peak id each).
[[rooms]]
name = "Beginner"
peak = 1
[[rooms]]
name = "Advanced"
peak = 2
[[rooms]]
name = "Elite"
peak = 3
[[rooms]]
name = "Intermediate"
peak = 4

# Connection/admission caps. lobby-load-1 (Brad 10-18) widened the relay
# range to ~1000 pairs; the global admission caps scale with it so a full
# house is admitted (max_connections ~2 players x 3 TCP conns per pair,
# max_sessions/queue = 2 players per pair). The per-IP caps below stay the
# per-player limits. Refused waiters stay queued; the quik echo carries
# FULL=1. The per-IP accept churn cap (120/min, hardcoded) still bounds
# one NAT/IP; real players are on distinct IPs.
[limits]
max_connections = 8192
max_per_ip = 16
msg_per_sec_per_ip = 60
max_sessions = 4096
max_queue = 4096
max_pairs = 999
max_pairs_per_ip = 4
max_queue_per_ip = 8
max_sessions_per_ip = 6
waiter_timeout_secs = 600
idle_probe_secs = 90
idle_close_secs = 240
# Buddy presence TCP idle lifetime (lobby-buddy-1: was hardcoded 300 s).
# Paired cover keeps racing pairs past both reaps; paired_grace_secs
# covers the results screen after the relay task ends.
buddy_close_secs = 300
paired_grace_secs = 300

[auth]
# Anonymous requested names receive numeric suffixes on collision. The
# random per-install DID binds the buddy connection; PASS is ignored.
mode = "open"

[relay]
mode = "always"
# Range includes the game's well-known P2P port 3658: the first pair
# gets 3658, so relay=always works with no client change. lobby-load-1:
# widened 3658-4657 (~1000 pairs). The STATE port (below) is fixed
# outside the range so future range changes never move it.
port_start = 3658
port_end = 4657
idle_timeout_secs = 120
# Per-pair / per-role packet token buckets (a stock-60 race needs
# ~40 pps per pair); per-role handshake bucket (one enrollment costs
# 2; garbage matching neither shape drops for free).
packets_per_sec = 300
burst_packets = 600
per_role_per_sec = 150
per_role_burst = 300
handshake_per_sec = 5
handshake_burst = 10
# Bandwidth ceiling with egress accounting: cost per forwarded datagram
# is payload + 28 B IP/UDP overhead (~4.7 MB per racing pair-hour
# measured). Global covers a full house (999 pairs) at per-pair maxima;
# the 8 TiB monthly cap (headroom under the free 10 TB/mo) gates new
# admissions and is the real backstop at sustained full rate.
bytes_per_sec_per_pair = 8192
burst_bytes_per_pair = 32768
global_bytes_per_sec = 8192000
global_burst_bytes = 16777216
monthly_egress_cap_bytes = 8796093022208

[health]
# External HEAD-monitor health (UptimeRobot): /healthz on TCP 8080.
port = 8080

[session]
# Session token required so the relay learns the listen side from a
# NON-game registration (LOB1 §10; relay drops mismatches).
token = true
quick_track = 2
quick_mode = 0
# Fixed server SKEY hex; empty = minted once at startup.
server_key = ""

[state_sync]
# Quick Play netplay (online-v0-1): 120<->120 matchmaking, START barrier,
# STATE relay and canonical results. lobby-load-1: fixed dedicated port
# 3657, just below the relay range, so widening the range never moves it
# (was 3757, the top of the old range). Stock clients bake in 3757
# (`ps2_netsync.h kDefaultPort`) unless PS2X_NET_SERVER/PS2X_NETSYNC_RELAY
# carries a port; `legacy_ports` keeps 3757 listening during the
# transition, and the new port goes into the public presets.
enable = true
bind = "0.0.0.0"
port = 3657
legacy_ports = [3757]
