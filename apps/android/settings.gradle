// Gradle settings for the SSX3-120 Android build.

// Plugin lookup: AGP lives on Google's Maven; Central and the Gradle plugin
// portal cover everything else.
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }

// Library lookup for the modules: Google's Maven and Maven Central.
dependencyResolutionManagement { repositories { google(); mavenCentral() } }

// The root project keeps its original name; the build has one module, :app.
rootProject.name = "PS2Recomp"
include(':app')
